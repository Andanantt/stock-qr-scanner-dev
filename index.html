<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Stock QR Scanner</title>

<!--
  SPEED V2:
  เปิดการเชื่อมต่อไปยัง server ของ Apps Script ล่วงหน้า
  ตอนส่ง VIN กลับไปจะได้ไม่ต้องรอเชื่อมต่อใหม่
-->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="https://script.google.com">

<!-- QR Scanner Library -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background: #eef2f9;

  color: #16233f;
}

.container {
  max-width: 480px;

  min-height: 100vh;

  margin: auto;

  padding: 24px 16px;
}

h1 {
  text-align: center;

  margin: 10px 0 20px;

  font-size: 24px;
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;

  border: none;
  background: transparent;

  color: #2f6fed;

  font-size: 16px;
  font-weight: 600;

  padding: 6px 0;

  cursor: pointer;
}

.back-btn:active {
  opacity: 0.6;
}

.scanner {
  background: #000;

  border-radius: 16px;

  overflow: hidden;
}

#reader {
  width: 100%;
}

#reader video {
  width: 100% !important;
}

.status {
  margin-top: 15px;

  text-align: center;

  font-size: 14px;

  color: #66738f;

  min-height: 22px;
}

.result {
  margin-top: 20px;

  background: #fff;

  border-radius: 16px;

  padding: 18px;

  text-align: center;
}

.result-title {
  font-size: 14px;

  color: #66738f;
}

.vin {
  margin-top: 8px;

  font-size: 20px;

  font-weight: 700;

  word-break: break-all;
}

</style>

</head>


<body>

<div class="container">

  <button
    type="button"
    class="back-btn"
    id="btnBack">
    ← กลับ
  </button>

  <h1>Scan QR</h1>

  <div class="scanner">

    <div id="reader"></div>

  </div>

  <div class="status" id="status">

    กำลังเตรียมกล้อง...

  </div>

  <div class="result">

    <div class="result-title">

      VIN ที่อ่านได้

    </div>

    <div class="vin" id="vin">

      -

    </div>

  </div>

</div>


<script>

/*
 * =========================================================
 * Stock QR Scanner — SPEED V2
 * =========================================================
 *
 * สิ่งที่ปรับให้เร็วขึ้น:
 *
 * 1. อ่านเฉพาะ QR Code (เดิมไลบรารีลองถอดทุกชนิดบาร์โค้ด
 *    ~15 แบบในทุกเฟรม ทำให้อ่านช้ามาก)
 * 2. ใช้ตัวอ่าน QR ที่มากับเบราว์เซอร์ (BarcodeDetector)
 *    ถ้าเครื่องรองรับ — เร็วกว่ามากบน Android/Chrome
 * 3. สแกน 20 ครั้ง/วินาที (เดิม 10) และไม่สแกนภาพกลับด้าน
 * 4. กรอบสแกนปรับตามขนาดจอ + ขอกล้องความละเอียดสูง
 *    และโฟกัสอัตโนมัติต่อเนื่อง (อ่าน QR เล็ก/ไกลได้ดีขึ้น)
 * 5. อ่านได้แล้วส่งกลับแอปทันที (เดิมรอ 0.5 วินาที)
 * 6. เปิดกล้องทันทีที่หน้าพร้อม ไม่ต้องรอรูป/ฟอนต์โหลดครบ
 *
 * ลิงก์ที่ส่งกลับแอปยังเหมือนเดิม:
 *   .../exec?vin=XXXXXXXXXXXXXXXXX
 *   .../exec?screen=scan   (ปุ่มกลับ)
 */


/*
 * =========================================================
 * CONFIGURATION
 * =========================================================
 */

const params = new URLSearchParams(window.location.search);

const APP_URL =
  params.get('returnUrl') ||
  'https://script.google.com/a/macros/tripetch-isuzu.co.th/s/AKfycbyPUawbWLA-U63oO6ifxn42rkfdgePQaOj6oYJwz_jKApQMjqTHdG4_HNkVKwus0xE_DQ/exec';

let scanner = null;

let scanCompleted = false;

const statusEl = document.getElementById("status");
const vinEl = document.getElementById("vin");


function buildAppUrl(extraParam) {

  const separator =
    APP_URL.includes('?') ? '&' : '?';

  return APP_URL + separator + extraParam;
}


/*
 * =========================================================
 * BACK TO STOCK CHECKING APP
 * =========================================================
 *
 * ไม่ต้องรอปิดกล้องให้เสร็จก่อน —
 * เมื่อเปลี่ยนหน้า เบราว์เซอร์จะปิดกล้องให้เอง
 */

document.getElementById("btnBack").addEventListener(
  "click",
  function() {

    try {
      if (scanner) scanner.stop().catch(function() {});
    } catch (e) {}

    window.location.replace(
      buildAppUrl('screen=scan')
    );
  }
);


/*
 * =========================================================
 * VIN CLEAN / EXTRACT
 * =========================================================
 *
 * QR บางอันอาจไม่ได้ส่งมาเป็น VIN เพียว ๆ
 *
 * ตัวอย่าง:
 *   MP1FRR90HRT000259
 *   MP1 FRR90HRT000259
 *   VIN: MP1FRR90HRT000259
 *   https://xxxxx/MP1FRR90HRT000259
 *
 * Function นี้จะพยายามดึง VIN 17 ตัวออกมา
 * =========================================================
 */

function extractVin(text) {

  const raw =
    String(text || '')
      .toUpperCase()
      .trim();

  // ลบ whitespace ทุกตำแหน่ง
  const cleaned =
    raw.replace(/\s+/g, '');

  // VIN ปกติ 17 ตัว และไม่ใช้ I, O, Q
  if (/^[A-HJ-NPR-Z0-9]{17}$/.test(cleaned)) {
    return cleaned;
  }

  // ถ้ามีข้อความอื่นปนมา ให้หา VIN 17 ตัวข้างใน
  const match =
    raw.match(/[A-HJ-NPR-Z0-9]{17}/);

  if (match) {
    return match[0];
  }

  // หา VIN 17 ตัวไม่ได้ → ส่งค่าที่ clean แล้วกลับไป
  return cleaned;
}


/*
 * =========================================================
 * ON QR READ
 * =========================================================
 */

function onScanSuccess(decodedText) {

  // ป้องกัน QR เดิมถูกอ่านซ้ำหลายครั้ง
  if (scanCompleted) {
    return;
  }

  scanCompleted = true;

  const vin =
    extractVin(decodedText);

  const targetUrl =
    buildAppUrl('vin=' + encodeURIComponent(vin));

  // แสดงผลและสั่นเบา ๆ ให้รู้ว่าอ่านได้แล้ว
  vinEl.textContent = vin;
  statusEl.textContent = "อ่าน QR สำเร็จ — กำลังเปิดข้อมูลรถ...";

  try {
    if (navigator.vibrate) navigator.vibrate(60);
  } catch (e) {}

  console.log("QR ORIGINAL:", decodedText, "| VIN:", vin, "| URL:", targetUrl);

  // ปิดกล้องแบบไม่ต้องรอ แล้วไปแอปทันที
  // (replace = กดย้อนกลับในเบราว์เซอร์จะไม่วนกลับมาหน้ากล้องที่อ่านเสร็จแล้ว)
  try {
    if (scanner) scanner.stop().catch(function() {});
  } catch (e) {}

  window.location.replace(targetUrl);
}


/*
 * =========================================================
 * START CAMERA
 * =========================================================
 */

function startScanner() {

  if (typeof Html5Qrcode === 'undefined') {
    statusEl.textContent = "โหลดตัวสแกนไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่";
    return;
  }

  scanner =
    new Html5Qrcode("reader", {

      // อ่านเฉพาะ QR Code → เร็วกว่าลองทุกชนิดบาร์โค้ดหลายเท่า
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ],

      // ใช้ตัวอ่าน QR ในตัวของเบราว์เซอร์ถ้ามี (Chrome/Android)
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      },

      verbose: false
    });


  const config = {

    // สแกน 20 ครั้งต่อวินาที (เดิม 10)
    fps: 20,

    // กรอบสแกน = 75% ของด้านที่สั้นกว่า (ปรับตามขนาดจอ)
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      const size = Math.floor(
        Math.min(viewfinderWidth, viewfinderHeight) * 0.75
      );
      return {
        width: Math.max(size, 200),
        height: Math.max(size, 200)
      };
    },

    // ไม่ต้องลองอ่านภาพกลับด้าน (QR บนรถไม่กลับด้าน) → ลดงานลงครึ่งหนึ่ง
    disableFlip: true,

    // ขอกล้องหลัง ความละเอียดสูง + โฟกัสต่อเนื่อง
    // (ถ้าเครื่องไม่รองรับ ค่าพวกนี้จะถูกข้ามไปเอง)
    videoConstraints: {
      facingMode: "environment",
      width: { ideal: 1280 },
      height: { ideal: 720 },
      advanced: [
        { focusMode: "continuous" }
      ]
    }
  };


  scanner
    .start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      function() {
        // ยังไม่เจอ QR ในเฟรมนี้ — ไม่ต้องแสดงอะไร
      }
    )
    .then(function() {
      statusEl.textContent = "กล้องพร้อมใช้งาน — เล็งไปที่ QR";
    })
    .catch(function(error) {

      console.error("Camera start failed:", error);

      // บางเครื่องไม่รับค่าความละเอียด/โฟกัสที่ขอ → ลองใหม่แบบพื้นฐาน
      startScannerBasic();
    });
}


/*
 * เปิดกล้องแบบพื้นฐาน (ใช้เมื่อเครื่องไม่รองรับค่าที่ขอด้านบน)
 */
function startScannerBasic() {

  const basicConfig = {
    fps: 20,
    qrbox: { width: 250, height: 250 },
    disableFlip: true
  };

  try {

    scanner
      .start(
        { facingMode: "environment" },
        basicConfig,
        onScanSuccess,
        function() {}
      )
      .then(function() {
        statusEl.textContent = "กล้องพร้อมใช้งาน — เล็งไปที่ QR";
      })
      .catch(function(error) {
        console.error("Camera start failed (basic):", error);
        statusEl.textContent = "เปิดกล้องไม่สำเร็จ — ตรวจสอบสิทธิ์การใช้กล้องของเบราว์เซอร์";
      });

  } catch (e) {
    console.error(e);
    statusEl.textContent = "เปิดกล้องไม่สำเร็จ";
  }
}


/*
 * =========================================================
 * START AS SOON AS THE PAGE IS READY
 * =========================================================
 *
 * เดิมรอ "load" (ต้องโหลดทุกอย่างครบ)
 * ตอนนี้เริ่มทันทีเมื่อ HTML พร้อม
 */

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", startScanner);
} else {
  startScanner();
}

</script>

</body>

</html>
